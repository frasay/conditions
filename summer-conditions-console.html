<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c4dbe9">
<title>Summer Conditions Console</title>
<style>
  :root{
    --page:#c4dbe9;
    --body1:#dcebf4;
    --body2:#c9e0ee;
    --recess:#c8deec;
    --lo:rgba(62,104,134,.38);
    --hi:rgba(255,255,255,.92);
    --ink:#15303f;
    --body-ink:#2a4556;
    --mute:#4a6677;
    --red:#d62f25;
    --red-hi:#ff5a49;
    --red-dk:#a91e16;
    --red-ink:#b3231a;
    --cyan:#58c3ee;
    --font:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    --spring:cubic-bezier(.3,1.5,.5,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--page);font-family:var(--font);color:var(--ink);
    -webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  a{color:inherit}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--red);outline-offset:4px;border-radius:12px}
  .stage{position:fixed;inset:0;overflow:hidden}

  /* ---------- Console body ---------- */
  .console{position:absolute;left:50%;top:50%;transform-origin:50% 50%;border-radius:34px;display:grid;
    background:linear-gradient(160deg,var(--body1),var(--body2));
    box-shadow:30px 38px 64px rgba(62,104,134,.34),-14px -14px 34px rgba(255,255,255,.85),inset 1px 1px 0 rgba(255,255,255,.95);
    visibility:hidden}
  .console.ready{visibility:visible}
  .console.land{width:1120px;height:680px;padding:32px;gap:28px;grid-template-columns:548px 1fr;--m:28px}
  .console.port{width:640px;height:1240px;padding:28px;gap:28px;grid-template-rows:600px 1fr;--m:24px}

  /* ---------- Speaker (grille, display, day strip) ---------- */
  .speaker{position:relative;border-radius:24px;overflow:hidden;background:#cfe3ef;
    box-shadow:inset 7px 9px 18px rgba(62,104,134,.40),inset -7px -7px 16px rgba(255,255,255,.95)}
  .grille{position:absolute;inset:0;
    background-image:
      radial-gradient(circle at 50% 50%,rgba(70,108,135,.55) 0 2.3px,transparent 3px),
      radial-gradient(circle at 50% 50%,rgba(255,255,255,.95) 0 2.3px,transparent 3px);
    background-size:15px 15px,15px 15px;background-position:0 0,1.3px 1.5px}
  .display{position:absolute;left:var(--m);right:var(--m);top:var(--m);bottom:calc(var(--m) + 100px);
    border-radius:20px;padding:20px 26px 16px;overflow:hidden;display:flex;flex-direction:column;
    background:linear-gradient(145deg,#f7fbfe,#e8f3f9);
    box-shadow:12px 16px 30px rgba(62,104,134,.40),-6px -6px 16px rgba(255,255,255,.75),inset 1px 1px 0 #fff}
  .d-top{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums}
  .place{margin:8px 0 0;font-size:34px;line-height:1.05;letter-spacing:-.02em;font-weight:600}
  .sub{margin:3px 0 0;font-size:13.5px;color:var(--mute)}
  .verdict{margin-top:12px}
  .lamps{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .lamp{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .lamp i{width:17px;height:17px;border-radius:50%;background:#c3d8e6;
    box-shadow:inset 2px 2px 4px rgba(62,104,134,.45),inset -1px -1px 2px rgba(255,255,255,.9);transition:background .3s,box-shadow .3s}
  .lamp.on{color:var(--ink)}
  .lamp.ok.on i{background:radial-gradient(circle at 35% 30%,#fff,#e9f7ff 55%,#bfe6f8);
    box-shadow:0 0 0 1.5px #fff,0 0 12px 4px rgba(88,195,238,.75),inset 0 0 3px rgba(88,195,238,.5)}
  .lamp.care.on i{background:radial-gradient(circle at 35% 30%,#ffd1cb,#ff8b7d 60%,#f0594a);
    box-shadow:0 0 10px 3px rgba(240,89,74,.45)}
  .lamp.no.on i{background:radial-gradient(circle at 35% 30%,#ff8878,var(--red) 55%,var(--red-dk));
    box-shadow:0 0 12px 4px rgba(214,47,37,.6)}
  .head{margin:10px 0 0;font-size:21px;line-height:1.2;font-weight:600;letter-spacing:-.01em;min-height:25px}
  .head.bad{color:var(--red-ink)}
  .win{margin:4px 0 0;font-size:14.5px;line-height:1.35;color:var(--body-ink)}
  .gauges{margin:auto 0;padding:10px 0 6px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .g{text-align:center;transition:opacity .3s}
  .g.off{opacity:.55}
  .g svg{display:block;width:100%;height:auto;overflow:visible}
  .g .nd{transform-origin:60px 58px;transition:transform .85s cubic-bezier(.25,1.35,.5,1)}
  .gv{margin-top:-4px;font-size:12px;color:var(--mute);line-height:1.1;min-height:23px}
  .gv b{font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.02em;margin-right:3px;font-variant-numeric:tabular-nums}
  .gl{margin-top:2px;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
  .foot{padding-top:8px;border-top:1px solid #cfdfe9;font-size:12.5px;line-height:1.35;color:var(--body-ink)}
  .foot p{margin:0}
  .foot p + p{color:var(--mute)}
  .foot .warn{color:var(--red-ink);font-weight:600}

  /* Day strip (the tuner) */
  .tuner{position:absolute;left:var(--m);right:var(--m);bottom:var(--m);height:84px;border-radius:14px;padding:12px 18px 0;
    background:#c9deec;box-shadow:inset 4px 5px 10px rgba(62,104,134,.36),inset -4px -4px 9px rgba(255,255,255,.9)}
  .strip{position:relative;display:flex;gap:4px;height:34px}
  .hr{flex:1;border-radius:5px;background:#bcd3e2;transition:background .3s,box-shadow .3s,opacity .3s}
  .hr.ok{background:linear-gradient(#fff,#eef9ff);box-shadow:0 0 0 1px #fff,0 0 9px 2px rgba(88,195,238,.65)}
  .hr.cr{background:#f4a89f}
  .hr.no{background:var(--red)}
  .hr.dk{background:repeating-linear-gradient(135deg,#bcd3e2 0 3px,#c9deec 3px 6px);opacity:.7}
  .hr.un{background:#bcd3e2;box-shadow:inset 0 0 0 1px #a9c3d4}
  .hr.past{opacity:.38}
  .hr.win{outline:2px solid var(--ink);outline-offset:2px}
  .needle{position:absolute;top:-6px;bottom:-5px;width:2px;margin-left:-1px;border-radius:1px;background:var(--red);
    transition:left .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 6px rgba(214,47,37,.55);pointer-events:none}
  .needle[hidden]{display:none}
  .slab-row{position:relative;height:16px;margin-top:9px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
  .slab-row span{position:absolute;top:0;transform:translateX(-50%);font-variant-numeric:tabular-nums;white-space:nowrap}
  .slab-row span:first-child{transform:none}
  .slab-row span:last-child{left:auto !important;right:0;transform:none}

  /* ---------- Controls ---------- */
  .controls{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
  .top{display:flex;align-items:center;justify-content:space-between;height:36px}
  .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .brand small{font-size:10px;font-weight:500;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;padding-top:2px}
  .led{width:9px;height:9px;border-radius:50%;background:#aac3d3;box-shadow:inset 1px 1px 2px rgba(0,0,0,.25),0 1px 0 #fff;transition:all .2s}
  .led.on{background:var(--red);box-shadow:0 0 9px 2px rgba(214,47,37,.6)}
  .sound{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(145deg,#eef6fb,#cfe2ee);box-shadow:4px 5px 10px var(--lo),-3px -3px 8px var(--hi);transition:box-shadow .12s,transform .12s}
  .sound:active{transform:scale(.96);box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
  .sound svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .sound .off{display:none}
  .sound[aria-pressed="true"] .on{display:none}
  .sound[aria-pressed="true"] .off{display:block}

  .lab{font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
  .dials{display:grid;grid-template-columns:250px 1fr;gap:12px;align-items:start}
  .col{display:flex;flex-direction:column;align-items:center}

  .dial{position:relative;touch-action:none}
  .dial.act{width:250px;height:250px}
  .dial.reg{width:208px;height:208px}
  .knob{position:absolute;left:50%;top:50%;border-radius:50%;cursor:grab;touch-action:none;
    background:linear-gradient(145deg,#f7fbfe,#d2e4f0);
    box-shadow:12px 16px 28px rgba(62,104,134,.45),-8px -8px 18px rgba(255,255,255,.95),inset 1px 1px 1px #fff;
    transition:transform .17s var(--spring),box-shadow .12s}
  .knob.grab{cursor:grabbing;box-shadow:8px 10px 20px rgba(62,104,134,.42),-6px -6px 14px rgba(255,255,255,.95),inset 1px 1px 1px #fff}
  .knob::before{content:"";position:absolute;inset:8px;border-radius:50%;
    background:repeating-conic-gradient(rgba(62,104,134,.20) 0 1.4deg,transparent 1.4deg 6deg);
    -webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
  .knob::after{content:"";position:absolute;left:50%;top:10px;width:6px;height:24px;margin-left:-3px;border-radius:3px;background:var(--red);
    box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
  .act .knob{width:120px;height:120px;margin:-60px 0 0 -60px}
  .reg .knob{width:124px;height:124px;margin:-62px 0 0 -62px}

  /* ring buoy bezel: red and white */
  .buoy{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;
    background:
      radial-gradient(circle at 30% 24%,rgba(255,255,255,.45),transparent 46%),
      repeating-conic-gradient(from 22.5deg,#fff 0 45deg,var(--red) 45deg 90deg);
    box-shadow:10px 14px 24px rgba(62,104,134,.42),-8px -8px 18px rgba(255,255,255,.9)}
  .socket{position:absolute;left:50%;top:50%;border-radius:50%;background:var(--recess);
    box-shadow:inset 5px 6px 12px rgba(62,104,134,.42),inset -5px -5px 10px rgba(255,255,255,.95)}
  .act .socket{width:138px;height:138px;margin:-69px 0 0 -69px}
  .reg .socket{width:146px;height:146px;margin:-73px 0 0 -73px}

  .cap{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;pointer-events:none;
    display:grid;place-items:center;font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    background:#f1f8fc;box-shadow:inset 3px 4px 8px rgba(62,104,134,.36),inset -3px -3px 6px rgba(255,255,255,.95)}
  .cap.num{font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

  .dlab{position:absolute;left:50%;top:50%;transform-origin:0 0;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
    transform:rotate(var(--a)) translateY(calc(var(--lr) * -1)) rotate(calc(var(--a) * -1)) translate(-50%,-50%);
    padding:8px 6px;cursor:pointer;transition:color .15s}
  .dlab.on{color:var(--red-ink)}
  .rtick{position:absolute;left:50%;top:50%;width:2px;height:8px;margin-left:-1px;background:#7f98a8;transform-origin:50% 0;
    transform:rotate(var(--a)) translateY(-90px);border-radius:1px;transition:background .15s,height .15s}
  .rtick.on{background:var(--red);height:12px}
  .ns{position:absolute;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--mute);transform:translate(-50%,-50%)}
  .read{margin-top:6px;min-width:150px;padding:8px 14px 7px;border-radius:12px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    background:var(--recess);box-shadow:inset 3px 4px 8px rgba(62,104,134,.38),inset -3px -3px 7px rgba(255,255,255,.95)}

  /* Comfort slider */
  .comfort{position:relative;padding:0 46px}
  .comfort .head2{display:flex;justify-content:space-between;align-items:baseline;margin:0 -46px 2px}
  .comfort .head2 .val{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--red-ink)}
  .slider{position:relative;height:88px;touch-action:none;cursor:pointer}
  .rail{position:absolute;left:0;right:0;top:28px;height:12px;margin-top:-6px;border-radius:6px;background:#c3d9e7;
    box-shadow:inset 3px 3px 6px rgba(62,104,134,.42),inset -3px -3px 6px rgba(255,255,255,.95)}
  .stop{position:absolute;top:2px;width:2px;height:12px;margin-left:-1px;background:#5f7d8f;border-radius:1px}
  .sthumb{position:absolute;top:28px;width:66px;height:46px;margin:-23px 0 0 -33px;border-radius:13px;cursor:grab;
    background:linear-gradient(145deg,#f9fcfe,#d6e7f1);
    box-shadow:8px 11px 18px rgba(62,104,134,.45),-5px -5px 12px rgba(255,255,255,.95),inset 1px 1px 0 #fff;
    transition:left .17s var(--spring),box-shadow .12s}
  .sthumb.grab{cursor:grabbing;box-shadow:5px 7px 12px rgba(62,104,134,.42),-4px -4px 9px rgba(255,255,255,.95),inset 1px 1px 0 #fff}
  .sthumb::before{content:"";position:absolute;left:12px;right:12px;top:10px;bottom:10px;
    background:repeating-linear-gradient(90deg,rgba(62,104,134,.30) 0 1px,transparent 1px 5px)}
  .sthumb::after{content:"";position:absolute;left:50%;top:7px;bottom:7px;width:4px;margin-left:-2px;border-radius:2px;background:var(--red);
    box-shadow:0 0 0 3px #f3f9fc}
  .slab{position:absolute;top:62px;transform:translateX(-50%);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--mute);padding:6px;white-space:nowrap;transition:color .15s}
  .slab.on{color:var(--ink)}

  /* Day switch + update button */
  .bottom{display:grid;grid-template-columns:1fr 124px;gap:14px;align-items:center}
  .seg{position:relative;display:grid;grid-template-columns:1fr 1fr;height:46px;border-radius:14px;padding:4px;
    background:#c8deec;box-shadow:inset 4px 5px 10px rgba(62,104,134,.40),inset -4px -4px 9px rgba(255,255,255,.95)}
  .seg .thumb{position:absolute;left:4px;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:10px;
    background:linear-gradient(145deg,#f9fcfe,#d9e9f3);box-shadow:4px 5px 9px rgba(62,104,134,.38),-2px -2px 6px rgba(255,255,255,.9);
    transition:transform .2s var(--spring)}
  .seg .thumb::after{content:"";position:absolute;left:50%;top:5px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:var(--red)}
  .seg[data-pos="1"] .thumb{transform:translateX(100%)}
  .seg button{position:relative;z-index:1;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
    border-radius:10px;transition:color .15s;padding-top:5px}
  .seg button[aria-checked="true"]{color:var(--ink)}
  .upd-wrap{display:grid;place-items:center}
  .upd-sock{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;background:var(--recess);
    box-shadow:inset 6px 7px 14px rgba(62,104,134,.42),inset -6px -6px 12px rgba(255,255,255,.95)}
  .upd{position:relative;width:94px;height:94px;border-radius:50%;color:#fff;display:grid;place-items:center;
    font-size:12px;font-weight:700;letter-spacing:.2em;padding-left:.2em;
    background:radial-gradient(circle at 34% 28%,var(--red-hi),var(--red) 52%,var(--red-dk));
    box-shadow:7px 11px 20px rgba(120,25,18,.38),-4px -4px 10px rgba(255,255,255,.85),inset 1px 2px 2px rgba(255,255,255,.4);
    transition:transform .09s ease-out,box-shadow .09s ease-out}
  .upd.down,.upd:active{transform:translateY(3px) scale(.965);
    box-shadow:2px 3px 6px rgba(120,25,18,.4),inset 5px 7px 12px rgba(90,10,5,.45),inset -2px -2px 6px rgba(255,170,150,.35)}
  .upd:focus-visible{outline-offset:7px;border-radius:50%}
  .upd::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--red);opacity:0;pointer-events:none}
  .upd.ping::after{animation:ping .95s ease-out}
  @keyframes ping{from{opacity:.75;transform:scale(1)}to{opacity:0;transform:scale(1.55)}}
  .attr{font-size:11px;line-height:1.35;color:var(--mute)}
  .attr a{text-decoration:underline;-webkit-user-select:text;user-select:text}

  @media (prefers-reduced-motion:reduce){
    .knob,.sthumb,.seg .thumb,.needle,.g .nd{transition-duration:.01s}
    .upd.ping::after{animation:none}
  }
</style>
</head>
<body>
<div class="stage">
<main class="console land" id="cs" aria-label="Summer Conditions Console">

  <section class="speaker" aria-label="Conditions">
    <div class="grille" aria-hidden="true"></div>
    <article class="display" id="display">
      <div class="d-top"><span id="dRead">Now</span><span id="dUpd"></span></div>
      <h1 class="place" id="dPlace">Auckland</h1>
      <p class="sub" id="dSub">Reading near Takapuna</p>
      <div class="verdict">
        <div class="lamps" id="lamps" role="img" aria-label="Verdict lights">
          <span class="lamp ok" id="lOk"><i></i>Looks OK</span>
          <span class="lamp care" id="lCare"><i></i>Take care</span>
          <span class="lamp no" id="lNo"><i></i>Not suitable</span>
        </div>
        <p class="head" id="dHead" aria-live="polite">Tuning in...</p>
        <p class="win" id="dWin" aria-live="polite"></p>
      </div>
      <div class="gauges" id="gauges"></div>
      <div class="foot"><p id="fA"></p><p id="fB"></p></div>
    </article>
    <div class="tuner" aria-hidden="true">
      <div class="strip" id="strip"><div class="needle" id="needle" hidden></div></div>
      <div class="slab-row" id="stripLab"></div>
    </div>
  </section>

  <section class="controls">
    <header class="top">
      <div class="brand"><span class="led" id="led"></span>conditions console<small>CC 1</small></div>
      <button class="sound" id="sound" aria-pressed="false" aria-label="Sound on">
        <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
    </header>

    <div class="dials">
      <div class="col">
        <div class="lab">Activity</div>
        <div class="dial act" id="aDial">
          <div class="buoy"><div class="socket" style="width:138px;height:138px;margin:-69px 0 0 -69px"></div></div>
          <div class="knob" id="aKnob" role="slider" tabindex="0" aria-label="Activity" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" aria-valuetext="Swim"></div>
          <div class="cap" id="aCap" aria-hidden="true">Swim</div>
        </div>
      </div>
      <div class="col">
        <div class="lab">Region</div>
        <div class="dial reg" id="rDial">
          <div class="socket"></div>
          <div class="knob" id="rKnob" role="slider" tabindex="0" aria-label="Region, north to south" aria-valuemin="0" aria-valuemax="9" aria-valuenow="1" aria-valuetext="Auckland"></div>
          <div class="cap num" id="rCap" aria-hidden="true">2</div>
        </div>
        <div class="read" id="rRead">Auckland</div>
      </div>
    </div>

    <div class="comfort">
      <div class="head2"><span class="lab" style="margin:0">Wind and wave comfort</span><span class="val" id="cVal">Steady</span></div>
      <div class="slider" id="cSlider">
        <div class="rail" id="cRail"></div>
        <div class="sthumb" id="cThumb" role="slider" tabindex="0" aria-label="How much wind and swell you are comfortable with" aria-valuemin="0" aria-valuemax="2" aria-valuenow="1" aria-valuetext="Steady"></div>
      </div>
    </div>

    <div class="bottom">
      <div>
        <div class="lab">Day</div>
        <div class="seg" id="segD" role="radiogroup" aria-label="Today or tomorrow" data-pos="0">
          <span class="thumb" aria-hidden="true"></span>
          <button role="radio" aria-checked="true" tabindex="0" data-v="0">Today</button>
          <button role="radio" aria-checked="false" tabindex="-1" data-v="1">Tomorrow</button>
        </div>
      </div>
      <div class="upd-wrap"><div class="upd-sock"><button class="upd" id="upd" aria-label="Update with the latest readings">UPDATE</button></div></div>
    </div>

    <p class="attr">Weather and wave data from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>. Area readings, not beach-specific. A guide only.</p>
  </section>

</main>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------------------------------------------------------------
     DATA
  --------------------------------------------------------------- */
  const ACTIVITIES = [
    { id:'swim',   label:'Swim',   noun:'a swim',   water:true },
    { id:'paddle', label:'Paddle', noun:'a paddle', water:true },
    { id:'ride',   label:'Ride',   noun:'a ride',   water:false },
    { id:'run',    label:'Run',    noun:'a run',    water:false }
  ];
  const COMFORT = [
    { label:'Gentle', k:.75 },
    { label:'Steady', k:1 },
    { label:'Bold',   k:1.15 }
  ];
  // Representative reading points, north to south
  const REGIONS = [
    { name:'Northland',     spot:'Bay of Islands',  lat:-35.281, lon:174.091 },
    { name:'Auckland',      spot:'Takapuna',        lat:-36.787, lon:174.770 },
    { name:'Coromandel',    spot:'Whitianga',       lat:-36.833, lon:175.700 },
    { name:'Bay of Plenty', spot:'Mount Maunganui', lat:-37.634, lon:176.186 },
    { name:'Hawke\u2019s Bay', spot:'Napier',        lat:-39.493, lon:176.912 },
    { name:'Taranaki',      spot:'New Plymouth',    lat:-39.056, lon:174.075 },
    { name:'Wellington',    spot:'Oriental Bay',    lat:-41.287, lon:174.794 },
    { name:'Nelson',        spot:'Tahunanui',       lat:-41.299, lon:173.254 },
    { name:'Canterbury',    spot:'New Brighton',    lat:-43.511, lon:172.729 },
    { name:'Otago',         spot:'St Clair',        lat:-45.914, lon:170.487 }
  ];

  /* Rough rules of thumb, NOT official guidance. [comfortable up to, not suitable from].
     Gusts in km/h, waves in metres. Comfort only moves the first number, so
     the "not suitable" limits never change. */
  const LIMITS = {
    swim:   { gust:[35, 55], wave:[0.8, 1.5] },
    paddle: { gust:[25, 40], wave:[0.5, 1.0] },
    ride:   { gust:[40, 65] },
    run:    { gust:[50, 80] }
  };
  const COLD_SEA = 14;        // below this, sea temperature gets a "cold water" flag
  const HEAT = [30, 35];      // air temperature, care / not suitable
  const HEAVY_RAIN_HOUR = 4;  // mm in one hour
  const RECENT_RAIN = 25;     // mm over the previous 48 hours, flags "recent heavy rain" for water activities
  const UV_COVER = 3;

  const state = { a:0, c:1, r:1, day:0 };
  let view = { status:'loading', data:null, at:null };
  const cache = new Map();

  /* ---------------------------------------------------------------
     SOUND (Web Audio, no files needed)
  --------------------------------------------------------------- */
  const Snd = (() => {
    let ctx = null, master = null, noise = null, on = true;
    function init(){
      if (ctx){ if (ctx.state === 'suspended') ctx.resume(); return ctx; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = .85; master.connect(ctx.destination);
      noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return ctx;
    }
    function click({f=2500,q=2,dur=.02,vol=.25,at=0}){
      if (!on || !init()) return;
      const t = ctx.currentTime + at;
      const s = ctx.createBufferSource(); s.buffer = noise;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
      const g = ctx.createGain();
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      s.connect(bp); bp.connect(g); g.connect(master);
      s.start(t, Math.random() * .5, dur + .03);
    }
    function tone({f=200,to=null,dur=.08,vol=.2,type='sine',at=0}){
      if (!on || !init()) return;
      const t = ctx.currentTime + at;
      const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .006);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
    }
    return {
      unlock: init,
      get on(){ return on; },
      set on(v){ on = v; },
      detent(i=0){ click({f:2300 + i * 140, q:3, dur:.018, vol:.3}); tone({f:900 + i * 80, dur:.025, vol:.05}); },
      slide(i=0){ click({f:1500 + i * 220, q:2.5, dur:.02, vol:.3}); tone({f:300 + i * 40, to:200, dur:.05, vol:.07}); },
      flick(){ click({f:1700, q:2, dur:.014, vol:.3}); click({f:1100, q:2, dur:.02, vol:.25, at:.028}); tone({f:170, to:95, dur:.06, vol:.14}); },
      press(){ tone({f:150, to:55, dur:.11, vol:.5}); click({f:1500, q:1.2, dur:.03, vol:.35}); },
      release(){ click({f:2800, q:2, dur:.014, vol:.2}); tone({f:240, to:160, dur:.05, vol:.1}); },
      ping(){ tone({f:1480, dur:.55, vol:.11}); tone({f:1480, dur:.6, vol:.045, at:.62}); }   // sonar ping
    };
  })();
  ['pointerdown','touchend','click','keydown'].forEach(ev =>
    window.addEventListener(ev, () => { if (Snd.on) Snd.unlock(); }, { passive:true }));

  /* ---------------------------------------------------------------
     NEW ZEALAND TIME (the forecast comes back in Pacific/Auckland time)
  --------------------------------------------------------------- */
  function nzNow(){
    if (window.__fakeNow) return window.__fakeNow;                 // test hook only
    const p = new Intl.DateTimeFormat('en-CA', { timeZone:'Pacific/Auckland', year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).formatToParts(new Date());
    const g = t => p.find(x => x.type === t).value;
    return `${g('year')}-${g('month')}-${g('day')}T${g('hour')}:${g('minute')}`;
  }
  const h12 = h => ((h + 11) % 12) + 1;
  const mer = h => (h % 24) < 12 ? 'am' : 'pm';
  const fmtH = h => `${h12(h)} ${mer(h)}`;
  const fmtRange = (a, b) => mer(a) === mer(b) ? `${h12(a)} to ${h12(b)} ${mer(a)}` : `${fmtH(a)} to ${fmtH(b)}`;
  const fmtClock = s => { const h = +s.slice(11, 13), m = s.slice(14, 16); return `${h12(h)}:${m} ${mer(h)}`; };

  /* ---------------------------------------------------------------
     LIVE DATA (Open-Meteo, no key needed)
  --------------------------------------------------------------- */
  async function getJSON(url){
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 12000);
    try {
      const res = await fetch(url, { signal:ctl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally { clearTimeout(to); }
  }
  function parseData(fc, mar){
    const h = fc.hourly;
    const d = { times:h.time, gust:h.wind_gusts_10m, temp:h.temperature_2m, precip:h.precipitation,
                code:h.weather_code, uv:h.uv_index, isDay:h.is_day, wave:null, sea:null };
    if (mar && mar.hourly && Array.isArray(mar.hourly.time)){
      const idx = new Map(mar.hourly.time.map((t, i) => [t, i]));
      const pull = arr => arr ? h.time.map(t => { const i = idx.get(t); const v = i == null ? null : arr[i]; return v == null ? null : v; }) : null;
      const w = pull(mar.hourly.wave_height), s = pull(mar.hourly.sea_surface_temperature);
      d.wave = w && w.some(v => v != null) ? w : null;
      d.sea  = s && s.some(v => v != null) ? s : null;
    }
    return d;
  }

  /* ---------------------------------------------------------------
     THE ASSESSMENT
  --------------------------------------------------------------- */
  function thresholds(actId, ci){
    const k = COMFORT[ci].k, out = {};
    for (const key of Object.keys(LIMITS[actId])){
      const [ok, no] = LIMITS[actId][key];
      out[key] = [Math.min(ok * k, no * 0.75), no];
    }
    return out;
  }
  function rain48(d, i){
    let s = 0;
    for (let k = Math.max(0, i - 47); k <= i; k++) s += d.precip[k] || 0;
    return s;
  }
  // level: 0 looks OK, 1 take care, 2 not suitable, null no usable reading
  function evaluate(d, i, act, ci){
    const th = thresholds(act.id, ci);
    let lvl = 0, why = [], unknown = false;
    const add = (l, r) => { if (l > lvl){ lvl = l; why = [r]; } else if (l === lvl && l > 0 && !why.includes(r)) why.push(r); };
    const band = (v, [ok, no]) => v <= ok ? 0 : v < no ? 1 : 2;
    const c = d.code[i]; if (c != null && c >= 95) add(2, 'thunderstorm');
    if (d.isDay[i] === 0) add(act.water ? 2 : 1, 'after dark');
    if (act.water){
      const w = d.wave ? d.wave[i] : null;
      if (w == null) unknown = true; else add(band(w, th.wave), 'big waves');
      const s = d.sea ? d.sea[i] : null;
      if (s != null && s < COLD_SEA) add(1, 'cold water');
      if (rain48(d, i) >= RECENT_RAIN) add(1, 'recent heavy rain');
    } else {
      const t = d.temp[i];
      if (t != null){ if (t >= HEAT[1]) add(2, 'very hot'); else if (t >= HEAT[0]) add(1, 'hot'); }
    }
    const g = d.gust[i];
    if (g == null) unknown = true; else add(band(g, th.gust), 'strong gusts');
    const p = d.precip[i]; if (p != null && p >= HEAVY_RAIN_HOUR) add(1, 'heavy rain');
    if (unknown && lvl === 0) return { lvl:null, why:[] };
    return { lvl, why };
  }
  function dayInfo(d, offset){
    const today = nzNow().slice(0, 10);
    const dates = [...new Set(d.times.map(t => t.slice(0, 10)))];
    let ti = dates.indexOf(today); if (ti < 0) ti = Math.min(2, dates.length - 1);
    const date = dates[ti + offset]; if (!date) return null;
    const idx = []; d.times.forEach((t, i) => { if (t.startsWith(date)) idx.push(i); });
    return { date, idx };
  }
  const joinWhy = w => { const u = [...new Set(w)].slice(0, 2).join(' and '); return u; };
  const topWhy = list => {
    const n = new Map(); list.forEach(x => x.why.forEach(r => n.set(r, (n.get(r) || 0) + 1)));
    return [...n.entries()].sort((a, b) => b[1] - a[1]).slice(0, 2).map(e => e[0]).join(' and ');
  };

  function analyse(){
    const act = ACTIVITIES[state.a], ci = state.c, d = view.data;
    const info = dayInfo(d, state.day);
    const out = { lamp:null, head:'No forecast for that day', bad:false, win:'', hours:[], best:null, focus:null, read:'', waveMissing:false, nowH:null, nowM:0 };
    if (!info) return out;
    const nowS = nzNow(), nowH = +nowS.slice(11, 13), nowM = +nowS.slice(14, 16), isToday = state.day === 0;
    out.nowH = isToday ? nowH : null; out.nowM = nowM;
    const waveMissing = act.water && !d.wave;
    out.waveMissing = waveMissing;
    const hours = info.idx.map(i => {
      const e = evaluate(d, i, act, ci);
      const day = d.isDay[i] === 1;
      return { i, h:+d.times[i].slice(11, 13), lvl:(waveMissing && day) ? null : e.lvl, why:e.why, day };
    });
    out.hours = hours;
    const future = hours.filter(x => x.day && (!isToday || x.h >= nowH));

    // best window: longest run of "looks OK" daylight hours, ties go to lower UV then earlier
    let best = null, run = [];
    const flush = () => {
      if (run.length){
        const uv = run.reduce((s, x) => s + (d.uv[x.i] || 0), 0) / run.length;
        const cand = { start:run[0].h, end:run[run.length - 1].h + 1, len:run.length, uv };
        if (!best || cand.len > best.len || (cand.len === best.len && cand.uv < best.uv - 0.01)) best = cand;
        run = [];
      }
    };
    for (const x of future){
      if (x.lvl === 0 && (!run.length || x.h === run[run.length - 1].h + 1)) run.push(x);
      else { flush(); if (x.lvl === 0) run.push(x); }
    }
    flush();
    out.best = waveMissing ? null : best;

    let focus;
    if (isToday) focus = hours.find(x => x.h === nowH) || hours[0];
    else focus = (out.best ? hours.find(x => x.h === out.best.start) : hours.find(x => x.h === 12)) || hours[0];
    out.focus = focus;
    out.read = isToday ? `Now \u00b7 ${h12(nowH)}:${String(nowM).padStart(2, '0')} ${mer(nowH)}` : `Tomorrow \u00b7 ${fmtH(focus.h)}`;

    const noun = act.noun;
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
    if (waveMissing){
      out.head = 'No wave reading'; out.win = 'Ask a lifeguard, or check the marine forecast.'; out.lamp = null;
      return out;
    }
    if (isToday){
      if (focus.lvl === null){ out.head = 'No reading right now'; }
      else if (focus.lvl === 0){ out.head = `Looks OK for ${noun} right now`; out.lamp = 0; }
      else if (focus.lvl === 1){ out.head = `Take care: ${joinWhy(focus.why)}`; out.lamp = 1; out.bad = true; }
      else { out.head = `Not suitable: ${joinWhy(focus.why)}`; out.lamp = 2; out.bad = true; }
      if (out.best) out.win = out.best.start <= nowH ? `Best window: now to ${fmtH(out.best.end)}` : `Best window: ${fmtRange(out.best.start, out.best.end)}`;
      else out.win = future.length ? 'No suitable window left today' : 'No daylight left today. Try tomorrow.';
    } else {
      const careHrs = future.filter(x => x.lvl === 1), noHrs = future.filter(x => x.lvl === 2);
      if (out.best){ out.head = `Looks OK for ${noun} tomorrow`; out.lamp = 0; out.win = `Best window: ${fmtRange(out.best.start, out.best.end)}`; }
      else if (careHrs.length){ out.head = `Take care tomorrow: ${topWhy(careHrs)}`; out.lamp = 1; out.bad = true; out.win = 'No suitable window'; }
      else if (noHrs.length){ out.head = `Not suitable tomorrow: ${topWhy(noHrs)}`; out.lamp = 2; out.bad = true; out.win = 'No suitable window'; }
      else { out.head = 'No reading for tomorrow'; }
    }
    return out;
  }

  /* ---------------------------------------------------------------
     GAUGES (needle instruments)
  --------------------------------------------------------------- */
  const SW = 240, A0 = -120;
  const pt = (r, a) => [60 + r * Math.sin(a * Math.PI / 180), 58 - r * Math.cos(a * Math.PI / 180)];
  const arc = (r, a0, a1) => {
    const [x0, y0] = pt(r, a0), [x1, y1] = pt(r, a1);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  };
  const fracAng = f => A0 + SW * clamp(f, 0, 1);

  function gaugeDefs(act){
    return [
      { key:'gust', label:'Gusts', unit:'km/h', min:0, max:80, fmt:v => String(Math.round(v)) },
      act.water ? { key:'wave', label:'Waves', unit:'m', min:0, max:3, fmt:v => v.toFixed(1) }
                : { key:'rain', label:'Rain', unit:'mm', min:0, max:8, fmt:v => v.toFixed(1) },
      act.water ? { key:'sea', label:'Sea temp', unit:'\u00b0C', min:10, max:26, fmt:v => String(Math.round(v)) }
                : { key:'air', label:'Air temp', unit:'\u00b0C', min:0, max:40, fmt:v => String(Math.round(v)) },
      { key:'uv', label:'UV', unit:'', min:0, max:12, fmt:v => String(Math.round(v)) }
    ];
  }
  function zonesFor(key, th){
    switch (key){
      case 'gust': return [{ a:th.gust[0], b:th.gust[1], t:'t' }, { a:th.gust[1], b:80, t:'s' }];
      case 'wave': return th.wave ? [{ a:th.wave[0], b:th.wave[1], t:'t' }, { a:th.wave[1], b:3, t:'s' }] : [];
      case 'rain': return [{ a:HEAVY_RAIN_HOUR, b:8, t:'t' }];
      case 'sea':  return [{ a:10, b:COLD_SEA, t:'t' }];
      case 'air':  return [{ a:HEAT[0], b:HEAT[1], t:'t' }, { a:HEAT[1], b:40, t:'s' }];
      case 'uv':   return [{ a:UV_COVER, b:8, t:'t' }, { a:8, b:12, t:'s' }];
    }
    return [];
  }
  function faceSVG(def, zones){
    const span = def.max - def.min;
    let s = `<path d="${arc(44, A0, A0 + SW)}" fill="none" stroke="#b6cfdf" stroke-width="6"/>`;
    zones.forEach(z => {
      const a = fracAng((z.a - def.min) / span), b = fracAng((z.b - def.min) / span);
      s += `<path d="${arc(44, a, b)}" fill="none" stroke="${z.t === 's' ? '#d62f25' : 'rgba(214,47,37,.34)'}" stroke-width="6"/>`;
    });
    for (let i = 0; i <= 20; i++){
      const a = A0 + SW * i / 20, major = i % 5 === 0;
      const [x0, y0] = pt(major ? 31 : 34, a), [x1, y1] = pt(38, a);
      s += `<line x1="${x0.toFixed(2)}" y1="${y0.toFixed(2)}" x2="${x1.toFixed(2)}" y2="${y1.toFixed(2)}" stroke="#4a6677" stroke-width="${major ? 1.4 : .8}" opacity="${major ? .85 : .5}"/>`;
    }
    const [lx, ly] = pt(44, A0), [rx, ry] = pt(44, A0 + SW);
    s += `<text x="${(lx - 1).toFixed(1)}" y="${(ly + 14).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="#4a6677">${def.min}</text>`;
    s += `<text x="${(rx + 1).toFixed(1)}" y="${(ry + 14).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="#4a6677">${def.max}</text>`;
    return s;
  }
  const gaugeEls = [];
  (function buildGauges(){
    const box = $('gauges');
    for (let i = 0; i < 4; i++){
      const root = document.createElement('div'); root.className = 'g';
      root.innerHTML = `<svg viewBox="0 0 120 100" aria-hidden="true"><g class="face"></g>
        <g class="nd" style="transform:rotate(${A0}deg)"><line x1="60" y1="66" x2="60" y2="21" stroke="#d62f25" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="60" cy="58" r="5.6" fill="#fff" stroke="#15303f" stroke-width="1.4"/><circle cx="60" cy="58" r="2" fill="#d62f25"/></g></svg>
        <div class="gv"></div><div class="gl"></div>`;
      box.appendChild(root);
      gaugeEls.push({ root, face:root.querySelector('.face'), nd:root.querySelector('.nd'), val:root.querySelector('.gv'), lab:root.querySelector('.gl') });
    }
  })();
  const setNeedle = (g, f) => { g.nd.style.transform = `rotate(${fracAng(f)}deg)`; };
  function paintGauges(values){          // values: array of numbers or null, or undefined to park everything
    const act = ACTIVITIES[state.a], th = thresholds(act.id, state.c), defs = gaugeDefs(act);
    defs.forEach((def, i) => {
      const g = gaugeEls[i], v = values ? values[i] : null;
      g.face.innerHTML = faceSVG(def, zonesFor(def.key, th));
      g.lab.textContent = def.label;
      let extra = def.unit;
      if (def.key === 'uv' && v != null && v >= UV_COVER) extra = 'cover up';
      g.val.innerHTML = v == null ? '<b>--</b>' : `<b>${def.fmt(v)}</b>${extra}`;
      g.root.classList.toggle('off', v == null);
      setNeedle(g, v == null ? 0 : (clamp(v, def.min, def.max) - def.min) / (def.max - def.min));
    });
  }
  let seekTimer = null;
  const stopSeek = () => { if (seekTimer){ clearInterval(seekTimer); seekTimer = null; } };
  const startSeek = () => { stopSeek(); seekTimer = setInterval(() => gaugeEls.forEach(g => setNeedle(g, Math.random())), reduce ? 1200 : 340); };

  /* ---------------------------------------------------------------
     DAY STRIP
  --------------------------------------------------------------- */
  const H0 = 6, H1 = 20, NH = H1 - H0 + 1;
  const strip = $('strip'), needle = $('needle'), cells = [];
  (function buildStrip(){
    for (let h = H0; h <= H1; h++){ const c = document.createElement('div'); c.className = 'hr un'; strip.insertBefore(c, needle); cells.push(c); }
    const row = $('stripLab');
    [[6, '6 am'], [9, '9 am'], [12, '12 pm'], [15, '3 pm'], [18, '6 pm'], [21, '9 pm']].forEach(([h, t]) => {
      const s = document.createElement('span'); s.style.left = ((h - H0) / NH * 100) + '%'; s.textContent = t; row.appendChild(s);
    });
  })();
  function paintStrip(an){
    cells.forEach((c, k) => {
      const h = H0 + k, x = an && an.hours.find(y => y.h === h);
      let cls = 'hr';
      if (!x) cls += ' un';
      else if (!x.day) cls += ' dk';
      else if (x.lvl === null) cls += ' un';
      else cls += x.lvl === 0 ? ' ok' : x.lvl === 1 ? ' cr' : ' no';
      if (an && an.nowH != null && h < an.nowH) cls += ' past';
      if (an && an.best && h >= an.best.start && h < an.best.end) cls += ' win';
      c.className = cls;
    });
    if (an && an.nowH != null && an.nowH >= H0 && an.nowH <= H1){
      needle.hidden = false; needle.style.left = (((an.nowH + an.nowM / 60 - H0) / NH) * 100) + '%';
    } else needle.hidden = true;
  }

  /* ---------------------------------------------------------------
     RENDER
  --------------------------------------------------------------- */
  const lamps = [$('lOk'), $('lCare'), $('lNo')];
  const LAMP_TEXT = ['Looks OK', 'Take care', 'Not suitable'];
  function setLamp(n){
    lamps.forEach((l, i) => l.classList.toggle('on', n === i));
    $('lamps').setAttribute('aria-label', n == null ? 'No verdict' : 'Verdict: ' + LAMP_TEXT[n]);
  }
  function footer(act, an){
    const A = { swim:'Swim between the flags. Never swim alone.', paddle:'Wear a lifejacket. Tell someone your plan.',
                ride:'Helmet on. Be seen.', run:'Carry water. Be seen.' }[act.id];
    let B = act.water ? 'Tides and rips are not shown here. Ask a lifeguard.' : 'Conditions change fast.';
    let warn = false;
    if (view.status === 'ok' && act.water && an && an.focus && view.data){
      if (rain48(view.data, an.focus.i) >= RECENT_RAIN){ B = 'Heavy rain lately. Check Can I Swim Here on LAWA before you go.'; warn = true; }
    } else if (view.status === 'ok' && !act.water && an && an.focus && view.data){
      const uv = view.data.uv[an.focus.i];
      if (an.focus.day && uv != null && uv >= UV_COVER) B = 'UV is up. Slip, slop, slap and wrap.';
    }
    $('fA').textContent = A; const fb = $('fB'); fb.textContent = B; fb.className = warn ? 'warn' : '';
  }
  function render(){
    const act = ACTIVITIES[state.a], reg = REGIONS[state.r];
    $('dPlace').textContent = reg.name; $('dSub').textContent = 'Reading near ' + reg.spot;
    $('rRead').textContent = reg.name;
    const head = $('dHead'), win = $('dWin');
    $('led').classList.toggle('on', view.status === 'loading');
    if (view.status === 'loading'){
      $('dRead').textContent = 'Tuning in'; $('dUpd').textContent = '';
      head.textContent = 'Tuning in...'; head.classList.remove('bad'); win.textContent = '';
      setLamp(null); paintGauges(null); paintStrip(null); footer(act, null); return;
    }
    if (view.status === 'error'){
      $('dRead').textContent = 'No signal'; $('dUpd').textContent = '';
      head.textContent = 'No live data'; head.classList.add('bad'); win.textContent = 'Check your connection, then press update.';
      setLamp(null); paintGauges(null); paintStrip(null); footer(act, null); return;
    }
    const an = analyse(), d = view.data, i = an.focus ? an.focus.i : null;
    $('dRead').textContent = an.read; $('dUpd').textContent = view.at ? 'Updated ' + fmtClock(view.at) : '';
    head.textContent = an.head; head.classList.toggle('bad', an.bad); win.textContent = an.win;
    setLamp(an.lamp);
    const defs = gaugeDefs(act);
    const vals = i == null ? null : defs.map(def => {
      switch (def.key){
        case 'gust': return d.gust[i]; case 'wave': return d.wave ? d.wave[i] : null; case 'rain': return d.precip[i];
        case 'sea': return d.sea ? d.sea[i] : null; case 'air': return d.temp[i]; case 'uv': return d.uv[i];
      }
    });
    paintGauges(vals); paintStrip(an); footer(act, an);
  }

  /* ---------------------------------------------------------------
     LOADING
  --------------------------------------------------------------- */
  let loadSeq = 0, loadTimer = null;
  const FRESH_MS = 15 * 60 * 1000;
  async function load(force){
    const ri = state.r, seq = ++loadSeq, c = cache.get(ri);
    if (!force && c && Date.now() - c.t < FRESH_MS){ stopSeek(); view = { status:'ok', data:c.d, at:c.at }; render(); return; }
    view = { status:'loading' }; render(); startSeek();
    const r = REGIONS[ri];
    const q = `latitude=${r.lat}&longitude=${r.lon}&timezone=Pacific%2FAuckland`;
    const fUrl = `https://api.open-meteo.com/v1/forecast?${q}&past_days=2&forecast_days=3&hourly=temperature_2m,precipitation,weather_code,wind_gusts_10m,uv_index,is_day`;
    const mUrl = `https://marine-api.open-meteo.com/v1/marine?${q}&forecast_days=3&hourly=wave_height,sea_surface_temperature`;
    const [f, m] = await Promise.allSettled([getJSON(fUrl), getJSON(mUrl)]);
    if (seq !== loadSeq) return;                                  // a newer request has taken over
    stopSeek();
    if (f.status !== 'fulfilled' || !f.value || !f.value.hourly || !Array.isArray(f.value.hourly.time)){
      view = { status:'error' }; render(); return;
    }
    const d = parseData(f.value, m.status === 'fulfilled' ? m.value : null);
    const at = nzNow();
    cache.set(ri, { t:Date.now(), d, at });
    view = { status:'ok', data:d, at }; render();
    Snd.ping(); const u = $('upd'); u.classList.remove('ping'); void u.offsetWidth; u.classList.add('ping');
  }
  const scheduleLoad = ms => { clearTimeout(loadTimer); loadTimer = setTimeout(() => load(false), ms); };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const c = cache.get(state.r);
    if (!c || Date.now() - c.t > 20 * 60 * 1000) load(true);
  });

  /* ---------------------------------------------------------------
     CONTROLS
  --------------------------------------------------------------- */
  function rotary(o){
    let idx = o.start, drag = false;
    const el = o.knob;
    function apply(i, user, committed){
      i = clamp(i, 0, o.angles.length - 1);
      const changed = i !== idx; idx = i;
      el.style.transform = `rotate(${o.angles[i]}deg)`;
      el.setAttribute('aria-valuenow', i); el.setAttribute('aria-valuetext', o.text(i));
      if (o.mark) o.mark(i);
      if (changed && user) o.sound(i);
      if (user && (changed || committed)) o.onChange(i, committed);
    }
    function fromPointer(e){
      const r = o.root.getBoundingClientRect();
      const a = Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))) * 180 / Math.PI;
      if (Math.abs(a) > 160) return;                                 // dead zone at the bottom
      let best = 0, bd = 1e9;
      o.angles.forEach((g, k) => { const dd = Math.abs(g - a); if (dd < bd){ bd = dd; best = k; } });
      apply(best, true, false);
    }
    el.addEventListener('pointerdown', e => { drag = true; el.classList.add('grab'); el.setPointerCapture(e.pointerId); fromPointer(e); e.preventDefault(); });
    el.addEventListener('pointermove', e => { if (drag) fromPointer(e); });
    const end = () => { if (!drag) return; drag = false; el.classList.remove('grab'); o.onChange(idx, true); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('keydown', e => {
      const k = e.key; let n = idx;
      if (k === 'ArrowRight' || k === 'ArrowUp') n = idx + 1;
      else if (k === 'ArrowLeft' || k === 'ArrowDown') n = idx - 1;
      else if (k === 'Home') n = 0; else if (k === 'End') n = o.angles.length - 1; else return;
      e.preventDefault(); apply(n, true, true);
    });
    apply(o.start, false, false);
    return { apply, get:() => idx };
  }

  // Activity: a ring-buoy dial with four positions
  const aAngles = [-105, -35, 35, 105];
  const aDial = $('aDial'); aDial.style.setProperty('--lr', '109px');
  const aLabs = [];
  const aCtl = rotary({
    root:aDial, knob:$('aKnob'), angles:aAngles, start:state.a,
    text:i => ACTIVITIES[i].label,
    mark:i => { $('aCap').textContent = ACTIVITIES[i].label; aLabs.forEach((l, k) => l.classList.toggle('on', k === i)); },
    sound:i => Snd.detent(i),
    onChange:i => { state.a = i; render(); }
  });
  ACTIVITIES.forEach((a, i) => {
    const b = document.createElement('button'); b.className = 'dlab'; b.textContent = a.label; b.tabIndex = -1;
    b.style.setProperty('--a', aAngles[i] + 'deg'); b.addEventListener('click', () => aCtl.apply(i, true, true));
    aDial.insertBefore(b, $('aKnob')); aLabs.push(b);
  });
  aCtl.apply(state.a, false, false);

  // Region: a tuning dial from north to south
  const rAngles = REGIONS.map((_, i) => -135 + i * 30);
  const rDial = $('rDial'), rTicks = [];
  rAngles.forEach(a => { const t = document.createElement('i'); t.className = 'rtick'; t.style.setProperty('--a', a + 'deg'); rDial.insertBefore(t, $('rKnob')); rTicks.push(t); });
  [['N', -1], ['S', 1]].forEach(([t, s]) => {
    const n = document.createElement('span'); n.className = 'ns'; n.textContent = t;
    n.style.left = `calc(50% + ${s * 74}px)`; n.style.top = 'calc(50% + 76px)'; rDial.appendChild(n);
  });
  const rCtl = rotary({
    root:rDial, knob:$('rKnob'), angles:rAngles, start:state.r,
    text:i => REGIONS[i].name,
    mark:i => { $('rCap').textContent = i + 1; $('rRead').textContent = REGIONS[i].name; rTicks.forEach((t, k) => t.classList.toggle('on', k === i)); },
    sound:i => Snd.detent(i % 6),
    onChange:(i, committed) => {
      state.r = i; $('dPlace').textContent = REGIONS[i].name; $('dSub').textContent = 'Reading near ' + REGIONS[i].spot;
      if (committed) scheduleLoad(reduce ? 0 : 160);
    }
  });

  // Comfort: a three-stop slider
  (function comfortSlider(){
    const slider = $('cSlider'), rail = $('cRail'), thumb = $('cThumb'), labs = [];
    let idx = state.c, drag = false;
    COMFORT.forEach((c, i) => {
      const left = (i / (COMFORT.length - 1) * 100) + '%';
      const st = document.createElement('i'); st.className = 'stop'; st.style.left = left; rail.appendChild(st);
      const b = document.createElement('button'); b.className = 'slab'; b.textContent = c.label; b.tabIndex = -1; b.style.left = left;
      b.addEventListener('click', () => set(i, true)); slider.appendChild(b); labs.push(b);
    });
    function set(i, user){
      i = clamp(i, 0, COMFORT.length - 1);
      const changed = i !== idx; idx = i; state.c = i;
      thumb.style.left = (i / (COMFORT.length - 1) * 100) + '%';
      $('cVal').textContent = COMFORT[i].label;
      thumb.setAttribute('aria-valuenow', i); thumb.setAttribute('aria-valuetext', COMFORT[i].label);
      labs.forEach((l, k) => l.classList.toggle('on', k === i));
      if (changed && user){ Snd.slide(i); render(); }
    }
    function fromPointer(e){
      const r = rail.getBoundingClientRect();
      set(Math.round(clamp((e.clientX - r.left) / r.width, 0, 1) * (COMFORT.length - 1)), true);
    }
    slider.addEventListener('pointerdown', e => {
      if (e.target.classList.contains('slab')) return;
      drag = true; thumb.classList.add('grab'); slider.setPointerCapture(e.pointerId); fromPointer(e); e.preventDefault();
    });
    slider.addEventListener('pointermove', e => { if (drag) fromPointer(e); });
    const end = () => { drag = false; thumb.classList.remove('grab'); };
    slider.addEventListener('pointerup', end); slider.addEventListener('pointercancel', end);
    thumb.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp'){ set(idx + 1, true); e.preventDefault(); }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown'){ set(idx - 1, true); e.preventDefault(); }
    });
    set(state.c, false);
  })();

  // Day: today or tomorrow
  (function daySwitch(){
    const el = $('segD'), btns = [...el.querySelectorAll('button')];
    function set(i, user){
      const changed = el.dataset.pos !== String(i);
      el.dataset.pos = i; state.day = i;
      btns.forEach((b, k) => { b.setAttribute('aria-checked', k === i); b.tabIndex = k === i ? 0 : -1; });
      if (changed && user){ Snd.flick(); render(); }
    }
    btns.forEach((b, i) => b.addEventListener('click', () => set(i, true)));
    el.addEventListener('keydown', e => {
      const cur = btns.findIndex(b => b.getAttribute('aria-checked') === 'true'); let n = cur;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') n = Math.min(1, cur + 1);
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') n = Math.max(0, cur - 1);
      if (n !== cur){ set(n, true); btns[n].focus(); e.preventDefault(); }
    });
  })();

  // Update button
  const upd = $('upd');
  upd.addEventListener('pointerdown', () => { upd.classList.add('down'); Snd.press(); });
  const up = () => { if (upd.classList.contains('down')){ upd.classList.remove('down'); Snd.release(); } };
  upd.addEventListener('pointerup', up); upd.addEventListener('pointerleave', up); upd.addEventListener('pointercancel', up);
  upd.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') upd.classList.add('down'); });
  upd.addEventListener('keyup',   e => { if (e.key === 'Enter' || e.key === ' ') upd.classList.remove('down'); });
  upd.addEventListener('click', () => load(true));

  // Sound toggle
  const soundBtn = $('sound');
  soundBtn.addEventListener('click', () => {
    const wasOn = Snd.on;
    if (wasOn) Snd.flick();
    Snd.on = !wasOn;
    soundBtn.setAttribute('aria-pressed', String(wasOn));
    soundBtn.setAttribute('aria-label', wasOn ? 'Sound off' : 'Sound on');
    if (!wasOn) Snd.flick();
  });

  /* ---------------------------------------------------------------
     LAYOUT: fit the whole console on desktop and iPad, either way up
  --------------------------------------------------------------- */
  const cs = $('cs'), LAND = { w:1120, h:680 }, PORT = { w:640, h:1240 };
  function layout(){
    const vw = window.innerWidth, vh = window.innerHeight, f = .95;
    const sL = Math.min(vw * f / LAND.w, vh * f / LAND.h), sP = Math.min(vw * f / PORT.w, vh * f / PORT.h);
    const land = sL >= sP, s = Math.min(land ? sL : sP, 1.7);
    cs.classList.toggle('land', land); cs.classList.toggle('port', !land);
    cs.style.transform = `translate(-50%,-50%) scale(${s})`;
    cs.classList.add('ready');
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 120));

  /* Go */
  layout();
  render();
  load(false);

  /* Test hook (used for automated checks, harmless in normal use) */
  window.__cc = { state, REGIONS, ACTIVITIES, COMFORT, LIMITS, evaluate, analyse, parseData, thresholds, render, load,
    get view(){ return view; }, setView(v){ view = v; }, cache };
})();
</script>
</body>
